<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almares 328 - Administrator Login</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Index.css">
</head>
<body>
    <div class="login-container">

        <!-- ============================================================
             LEFT PANEL — BRAND
             ============================================================ -->
        <div class="left-panel">
            <div class="brand-wrapper">
                <div class="brand-kicker">
                    <span class="brand-kicker__dot"></span>
                    <span class="brand-kicker__line"></span>
                    <span class="brand-kicker__text">Almares 328 Grocery Store</span>
                </div>
                <div class="logo-container">
                    <img src="Logo.png" alt="WholeSale Grocery Store Logo" class="brand-logo no-download" draggable="false">
                </div>
            </div>
        </div>

        <!-- ============================================================
             RIGHT PANEL — ADMIN LOGIN
             ============================================================ -->
        <div class="right-panel">
            <div class="login-card">

                <div class="card-header">
                    <a href="/" class="card-back-link" aria-label="Back to role selection">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </a>
                    <span class="line"></span>
                    <h2>Administrator Login</h2>
                    <span class="line"></span>
                </div>

                <div class="form-status" id="form-status" role="alert" hidden></div>

                <form class="login-form" id="form-admin">
                    <div class="input-label">Email or username:</div>
                    <div class="input-wrapper">
                        <div class="icon-badge">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                                <path d="M3.5 6.5L12 13L20.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <input type="text" id="admin-email" placeholder="Enter your email or username" autocomplete="username" required>
                    </div>

                    <div class="input-label">Password:</div>
                    <div class="input-wrapper">
                        <div class="icon-badge">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect x="5" y="11" width="14" height="9" rx="1.6" stroke="currentColor" stroke-width="1.8"/>
                                <path d="M8 11V7.5A4 4 0 0 1 16 7.5V11" stroke="currentColor" stroke-width="1.8"/>
                            </svg>
                        </div>
                        <input type="password" id="admin-password" placeholder="Enter your password" autocomplete="current-password" required>
                        <span class="password-toggle" data-target="admin-password"><svg class="toggle-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 12C4 7.5 7.8 5 12 5C16.2 5 20 7.5 22 12C20 16.5 16.2 19 12 19C7.8 19 4 16.5 2 12Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><line x1="3.5" y1="20.5" x2="20.5" y2="3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                    </div>

                    <div class="remember-me-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="admin-remember-me" checked>
                            <span>Keep me logged in</span>
                        </label>
                    </div>

                    <div class="forgot-password-container">
                        <button type="button" class="forgot-password forgot-password-btn">Forgot Password</button>
                    </div>

                    <button type="submit" class="login-btn" id="admin-submit">
                        <span class="login-btn__label">Login</span>
                        <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 5L15 12L9 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>

                    <p class="auth-switch">
                        Need an admin account? Ask an existing admin to add you from the Accounts page.
                    </p>
                </form>

                <!-- FIRST-LOGIN EMAIL VERIFICATION (new admin accounts only) === -->
                <form class="login-form" id="form-otp-verify" hidden>
                    <p class="reset-password__email" id="otp-sent-to"></p>

                    <div class="input-label">Enter the 6-digit code:</div>
                    <div class="otp-digit-group" id="otp-digit-group">
                        <input type="text" class="otp-digit-input" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-index="0">
                        <input type="text" class="otp-digit-input" inputmode="numeric" maxlength="1" autocomplete="off" data-index="1">
                        <input type="text" class="otp-digit-input" inputmode="numeric" maxlength="1" autocomplete="off" data-index="2">
                        <input type="text" class="otp-digit-input" inputmode="numeric" maxlength="1" autocomplete="off" data-index="3">
                        <input type="text" class="otp-digit-input" inputmode="numeric" maxlength="1" autocomplete="off" data-index="4">
                        <input type="text" class="otp-digit-input" inputmode="numeric" maxlength="1" autocomplete="off" data-index="5">
                    </div>

                    <button type="submit" class="login-btn login-btn--top-gap" id="otp-verify-submit">
                        <span class="login-btn__label">Verify & Continue</span>
                        <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 5L15 12L9 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>

                    <p class="auth-switch">
                        Didn't get a code?
                        <button type="button" class="auth-switch__link" id="otp-resend-btn">Resend code</button>
                    </p>
                    <p class="auth-switch">
                        <button type="button" class="auth-switch__link" id="otp-cancel-btn">Cancel</button>
                    </p>
                </form>

            </div>
        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="AdminLogin.js"></script>
</body>
</html>
