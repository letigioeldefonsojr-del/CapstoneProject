<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almares 328 - Sign In</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Login.css?v=20261116d">
</head>
<body>
    <div class="login-container">

        <!-- ============================================================
             LEFT PANEL — BRAND
             ============================================================ -->
        <div class="left-panel">
            <div class="brand-wrapper">
                <div class="brand-kicker">
                    <span class="brand-kicker__dot"></span>
                    <span class="brand-kicker__line"></span>
                    <span class="brand-kicker__text">Almares 328 Grocery Store</span>
                </div>
                <div class="logo-container">
                    <img src="Logo.png" alt="WholeSale Grocery Store Logo" class="brand-logo no-download" draggable="false">
                </div>
            </div>
        </div>

        <!-- ============================================================
             RIGHT PANEL — SIGN IN
             ============================================================ -->
        <div class="right-panel">
            <div class="login-card">

                <div class="card-header">
                    <span class="line"></span>
                    <h2>Sign in</h2>
                    <span class="line"></span>
                </div>

                <p class="role-select__subtitle">Enter your username, email or mobile number. We'll take you to the right place.</p>

                <div class="form-status" id="form-status" role="alert" hidden></div>

                <form class="login-form" id="form-identify" novalidate>
                    <div class="input-label">Username, email or mobile:</div>
                    <div class="input-wrapper">
                        <div class="icon-badge">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/>
                                <path d="M4.5 20C5.5 16 8.4 14.3 12 14.3C15.6 14.3 18.5 16 19.5 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <input type="text" id="identifier" placeholder="Enter here" autocomplete="username" required>
                    </div>

                    <button type="submit" class="login-btn login-btn--top-gap" id="identify-submit">
                        <span class="login-btn__label">Continue</span>
                        <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 5L15 12L9 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>

                    <div class="login-alt">
                        <span class="login-alt__title">New customer?</span>
                        <a class="login-alt__btn" href="Shop#/register">Create a customer account</a>
                    </div>
                </form>

                <p class="login-staff-note">Staff member? <a href="EmployeeLogin?signup=1">Staff sign-up</a></p>

            </div>
        </div>

    </div>
<script type="module" src="Login.js?v=20261116f"></script>
</body>
</html>
