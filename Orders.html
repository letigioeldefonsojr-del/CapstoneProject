<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almares 328 | Orders</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>

<div class="app-shell">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar__top">
            <div class="sidebar__identity">
                <span class="sidebar__avatar" id="sidebar-avatar">--</span>
                <div class="sidebar__identity-text">
                    <span class="topbar__logged-in">Logged in as</span>
                    <span class="role-badge" id="role-badge">—</span>
                </div>
            </div>
            <button type="button" class="sidebar__collapse-btn" id="collapse-btn" aria-label="Collapse sidebar">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M9 5L4 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M17 5L12 12L17 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <nav class="sidebar__nav">
            <a href="Dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
                    <rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
                    <rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
                    <rect x="13" y="13" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
                </svg>
                <span class="nav-item__label">Dashboard</span>
            </a>

            <a href="Inventory.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3L20.5 7.5V16.5L12 21L3.5 16.5V7.5L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M3.5 7.5L12 12M12 12L20.5 7.5M12 12V21" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                </svg>
                <span class="nav-item__label">Inventory</span>
            </a>

            <a href="Orders.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M4 6H20L18.5 15H6.5L5 4H2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="9" cy="19.5" r="1.4" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="17" cy="19.5" r="1.4" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span class="nav-item__label">Orders</span>
            </a>

            <a href="Forecast.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M3.5 17L9 11L13 15L20.5 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14.5 6.5H20.5V12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="nav-item__label">Forecast</span>
            </a>

            <a href="Notifications.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M6 10.5C6 7 8.5 4.5 12 4.5C15.5 4.5 18 7 18 10.5C18 15 19.5 16 19.5 16.5H4.5C4.5 16 6 15 6 10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M9.5 19.5C10 20.4 10.9 21 12 21C13.1 21 14 20.4 14.5 19.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <span class="nav-item__label">Notifications</span>
                <span class="nav-item__badge" id="notif-badge" hidden></span>
            </a>

            <a href="Feedback.html" class="nav-item" hidden id="feedback-nav-link">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M20.5 12C20.5 16.1 16.7 19.5 12 19.5C10.7 19.5 9.5 19.2 8.4 18.7L3.5 19.5L4.7 15.4C3.9 14.2 3.5 13.1 3.5 12C3.5 7.9 7.3 4.5 12 4.5C16.7 4.5 20.5 7.9 20.5 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M8.5 11.5L9.7 13L11.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="nav-item__label">Feedback</span>
            </a>
        </nav>

        <div class="sidebar__foot">
            <button type="button" class="nav-item nav-item--logout" id="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M9 21H5.5C4.7 21 4 20.3 4 19.5V4.5C4 3.7 4.7 3 5.5 3H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 16L20.5 12L16 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20.5 12H9.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <span class="nav-item__label">Log out</span>
            </button>
            <button type="button" class="delete-account-link" id="delete-account-btn">Delete Account</button>
        </div>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="topbar__datetime">
                <span class="topbar__date" id="topbar-date">—</span>
                <span class="topbar__time" id="topbar-time">—</span>
            </div>
            <h1 class="topbar__greeting" id="greeting">Hello</h1>
        </header>

        <!-- ================================================================
             ORDERS (Employee only — see note in Orders.js. Admin sees a
             short explanatory message instead, matching your rules, which
             only grant order read/write to isEmployee()).
             ================================================================ -->
        <div class="order-status-grid" id="order-status-grid">
            <button type="button" class="order-status-card is-active" data-status="all">
                <span class="order-status-card__value" id="count-all">—</span>
                <span class="order-status-card__label">All Orders</span>
            </button>
            <button type="button" class="order-status-card" data-status="pending">
                <span class="order-status-card__value" id="count-pending">—</span>
                <span class="order-status-card__label">Pending</span>
            </button>
            <button type="button" class="order-status-card" data-status="approved">
                <span class="order-status-card__value" id="count-approved">—</span>
                <span class="order-status-card__label">Approved</span>
            </button>
            <button type="button" class="order-status-card" data-status="on_the_way">
                <span class="order-status-card__value" id="count-on_the_way">—</span>
                <span class="order-status-card__label">On Its Way</span>
            </button>
            <button type="button" class="order-status-card" data-status="delivered">
                <span class="order-status-card__value" id="count-delivered">—</span>
                <span class="order-status-card__label">Delivered</span>
            </button>
            <button type="button" class="order-status-card" data-status="cancelled">
                <span class="order-status-card__value" id="count-cancelled">—</span>
                <span class="order-status-card__label">Cancelled / Rejected</span>
            </button>
            <button type="button" class="order-status-card" data-status="undelivered">
                <span class="order-status-card__value" id="count-undelivered">—</span>
                <span class="order-status-card__label">Undelivered</span>
            </button>
        </div>

        <div class="tab-row" id="cancelled-subtabs" hidden>
            <button type="button" class="tab-row__btn is-active" data-substatus="cancelled">Cancelled</button>
            <button type="button" class="tab-row__btn" data-substatus="rejected">Rejected</button>
        </div>

        <div class="orders-search-bar">
            <div class="search-field">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M20 20L15.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input type="text" id="orders-search-input" placeholder="Search by Order ID, customer name, or date...">
            </div>
        </div>

        <div class="panel orders-panel">
            <table class="inventory-table orders-table">
                <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Customer</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <tr><td colspan="7" class="inventory-empty">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>

    </main>
</div>

<!-- ================================================================
     MARK UNDELIVERABLE MODAL (asks for a reason, matching mobile)
     ================================================================ -->
<div class="modal-overlay" id="undeliverable-modal-overlay" hidden>
    <div class="modal">
        <div class="modal__header">
            <h3>Mark as Undeliverable</h3>
            <button type="button" class="modal__close" id="undeliverable-modal-close" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="modal__body">
            <div class="form-field">
                <label for="undeliverable-reason">Reason</label>
                <textarea id="undeliverable-reason" rows="3" placeholder="e.g. Customer not available, wrong address..."></textarea>
            </div>
            <p class="form-status" id="undeliverable-status" hidden></p>
        </div>
        <div class="modal__footer">
            <button type="button" class="btn-outline" id="undeliverable-cancel">Cancel</button>
            <button type="button" class="btn-danger-outline" id="undeliverable-confirm">Confirm</button>
        </div>
    </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="Sidebar.js"></script>
<script type="module" src="Orders.js"></script>
</body>
</html>
